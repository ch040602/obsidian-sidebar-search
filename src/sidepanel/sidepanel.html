<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Obsidian Companion</title>
    <link rel="stylesheet" href="./sidepanel.css" />
  </head>
  <body>
    <header class="topbar">
      <div>
        <h1 data-i18n="appTitle">Obsidian Companion</h1>
        <p id="status" class="muted" data-i18n="vaultChecking">Vault 상태 확인 중</p>
      </div>
      <div class="topbar-actions">
        <select id="ui-language" title="Language">
          <option value="ko">한국어</option>
          <option value="en">English</option>
        </select>
        <button id="open-options" data-i18n="settings" data-i18n-title="openSettings" title="설정 열기">설정</button>
      </div>
    </header>

    <section class="panel section-primary">
      <h2 data-i18n="selectionTagSearch">선택어 태그 검색</h2>
      <p class="hint" data-i18n="selectionTagSearchHelp">웹페이지에서 단어를 드래그한 뒤 이 패널을 열면 해당 단어를 Obsidian 실제 태그로 검색합니다.</p>
      <div class="row">
        <input id="query" type="search" data-i18n-placeholder="queryPlaceholder" placeholder="예: obsidian, web-clipper, #research" />
        <button id="search-tag" data-i18n="tag">태그</button>
        <button id="search-text" data-i18n="fullText">전체</button>
      </div>
      <p id="query-info" class="muted"></p>
    </section>

    <section class="panel">
      <h2 data-i18n="currentPage">현재 페이지</h2>
      <div id="page-context" class="context-box"></div>
      <div class="row wrap">
        <button id="related-search" data-i18n="relatedNotes">관련 노트</button>
        <button id="clip-current-page" data-i18n="clipCurrentPage">현재 페이지 저장</button>
        <button id="reindex" data-i18n="rebuildIndex">인덱스 재생성</button>
      </div>
    </section>

    <section class="panel">
      <h2 data-i18n="searchResults">검색 결과</h2>
      <div id="results" class="results"></div>
    </section>

    <template id="result-template">
      <article class="result-card">
        <div class="result-main">
          <h3 class="result-title"></h3>
          <p class="result-path"></p>
          <p class="result-excerpt"></p>
          <p class="result-reasons"></p>
          <div class="tag-list"></div>
        </div>
        <div class="result-actions">
          <button class="open-note" data-i18n="openInObsidian">Obsidian에서 열기</button>
        </div>
      </article>
    </template>

    <script type="module" src="./sidepanel.js"></script>
  </body>
</html>

<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Obsidian Companion Settings</title>
    <link rel="stylesheet" href="./options.css" />
  </head>
  <body>
    <main>
      <h1 data-i18n="settingsTitle">Obsidian Companion 설정</h1>

      <section class="card">
        <h2 data-i18n="vaultAccess">Vault 접근</h2>
        <p data-i18n="vaultAccessHelp">REST API 없이 Chrome File System Access API로 사용자가 선택한 Vault 폴더에 직접 접근합니다.</p>
        <div class="row">
          <button id="choose-vault" data-i18n="chooseVault">Vault 폴더 선택</button>
          <button id="forget-vault" data-i18n="forgetVault">Vault 연결 해제</button>
          <button id="test-permission" data-i18n="testPermission">권한 확인</button>
        </div>
        <p id="vault-status" class="muted"></p>
      </section>

      <section class="card">
        <h2 data-i18n="generalSettings">기본 설정</h2>
        <label>
          <span data-i18n="language">언어</span>
          <select id="ui-language">
            <option value="ko">한국어</option>
            <option value="en">English</option>
          </select>
        </label>
        <label>
          <span data-i18n="vaultName">Vault 이름</span>
          <input id="vault-name" data-i18n-placeholder="vaultNamePlaceholder" placeholder="Obsidian 앱의 Vault 이름" />
        </label>
        <label>
          <span data-i18n="defaultClipFolder">기본 클립 폴더</span>
          <input id="default-clip-folder" placeholder="Web Clips" />
        </label>
        <label>
          <span data-i18n="assetFolder">이미지 저장 폴더</span>
          <input id="asset-folder" placeholder="_assets/web-clips" />
        </label>
        <label>
          <span data-i18n="maxImageBytes">이미지 최대 크기(bytes)</span>
          <input id="max-image-bytes" type="number" min="100000" step="100000" />
        </label>
      </section>

      <section class="card">
        <h2 data-i18n="privacyFilters">프라이버시 필터</h2>
        <label>
          <span data-i18n="excludedFolders">제외 폴더, 줄 단위</span>
          <textarea id="excluded-folders" rows="6"></textarea>
        </label>
        <label>
          <span data-i18n="excludedTags">제외 태그, 줄 단위</span>
          <textarea id="excluded-tags" rows="5"></textarea>
        </label>
      </section>

      <section class="card">
        <h2 data-i18n="index">인덱스</h2>
        <div class="row">
          <button id="rebuild-index" data-i18n="rebuildIndex">인덱스 재생성</button>
          <button id="save-settings" data-i18n="saveSettings">설정 저장</button>
        </div>
        <p id="index-status" class="muted"></p>
      </section>
    </main>

    <script type="module" src="./options.js"></script>
  </body>
</html>
